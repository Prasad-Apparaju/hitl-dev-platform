findings:
- id: F1
  class: decide
  check: "the Conventions data-layer block under no config, blocking true, an empty data_layer key, and no data dir"
  claim: "Conventions prose and the CI template disagree on what blocking mode does with a warning."
  evidence: "check-conventions/SKILL.md:125-126 passed --strict to the validator in blocking mode; --strict is exit 1 on an unwaived warning (check_data_layer.py:741); the prose at :132 named only exit 2 and a scorecard regression; the shipped worked example exits 1 under --strict because of its q:5 warning"
  status: fixed
  resolved_by: de692d023ec23d580fe54a9b34988bbc9dbfa26b
  verified_by: "release owner's decision (this session, 2026-09-30): a warning never fails blocking mode; --strict removed from the validator call in Conventions, kept on the scorecard; the prose states that warn lines are Warnings in both modes; the CI template already failed only on exit 2. Round 2 correctness record re-runs the block in blocking mode on the worked example"
- id: F2
  class: decide
  check: "the data-layer suites map to requirements §8.2 rows 1 to 6"
  claim: "§8.2 row 4 \"an ontology entry naming a service\" is not what the validator catches."
  evidence: "mutation on a scratch copy: definition 'A customer purchase, served by the orders-service over gRPC' gave 0 blocking, exit 0; the rule caught paths, URLs, extensions, other entities' store names, activity, source and file names only"
  status: fixed
  resolved_by: de692d023ec23d580fe54a9b34988bbc9dbfa26b
  verified_by: "release owner's decision (this session, 2026-09-30): the code widened to the requirement, not the requirement narrowed to the code. Service-shaped tokens (-service, _service, -svc, grpc, endpoint) joined the schema's implementation markers, and a name or synonym equal to a manifest domain or service name fires unless it is the entity's own store or name; NEG-1b and NEG-1c prove both by mutation; LLD §4 and the test plan updated. Round 2 correctness record re-runs the reviewer's mutation"
- id: F3
  class: minor
  check: "every bold changelog claim under 2.15.0 has a carrier"
  claim: "\"101 tests by mutation\" is 102."
  evidence: "pytest per file: 61, 16, 25"
  status: fixed
  resolved_by: de692d023ec23d580fe54a9b34988bbc9dbfa26b
  verified_by: "the section now says 104, the count after NEG-1b and NEG-1c; round 2 records re-read it against the suites"
