findings:
- id: F1
  class: stops
  check: "the plugin builds from 66304b1 with the source-path guard clean and version 2.14.0"
  claim: "build.sh refuses to build 2.14.0 because shared/team-pulse.md is named by the team-pulse skill but is not in the SHARED_PROSE allowlist."
  evidence: "exit 2, MISSING shared/team-pulse.md; scripts/build.sh:440 lists seven prose files, none team-pulse.md; ai/shared/team-pulse.md exists in source; the built shared/usage-guide.md also links team-pulse.md; the stale sweep at build.sh:448-460 deletes any top-level shared/*.md not on the list, so a hand copy would not survive"
  status: fixed
  resolved_by: "plugin repo scripts/build.sh:440, team-pulse.md added to SHARED_PROSE, committed in the 2.14.0 build commit on release/2.x; source unchanged at 66304b1"
  verified_by: "round 2 upgrade record re-builds from a fresh scratch copy and re-checks the reachability list"
- id: F2
  class: minor
  check: "the shipped-validators manifest lists the built hashes of skipped_line.py, check_skips.py, gen_change.py and the built workflows.yaml"
  claim: "shipped-validators.sha256 carries a second 2.14.0 hash for skipped_line.py (0025330c…) that matches pre-release commit bff41fd, not any shipped build."
  evidence: "git show bff41fd:ci/first-pass/skipped_line.py hashes to 0025330c; the built file hashes to e1f70f0f, also listed"
  status: accepted
  accepted_by: "release owner (this session, 2026-09-22): a dead manifest line matches no product repo's file; manifest lines are append-only; removing it would move the reviewed commit"
- id: F3
  class: decide
  check: "the plugin builds from 66304b1 with the source-path guard clean and version 2.14.0"
  claim: "The build only reaches the reachability check with the uncommitted build.sh team-pulse block; release/2.x as committed does not ship pulse.py."
  evidence: "git diff scripts/build.sh in the scratch copy is the only source of the shared/tools/team-pulse copy"
  status: accepted
  accepted_by: "release owner (this session, 2026-09-22): release.sh commits the plugin repo's working tree as the build commit, which is how the 2.13.0 allowlist edit shipped; the block lands in the 2.14.0 build commit together with the F1 fix"
- id: F4
  class: minor
  check: "stale test cleanup: the source test_skipped_line.py hash is in retired-tests and dev-update names the file"
  claim: "retired-tests.sha256 lists two hashes for test_skipped_line.py, one of which (d54444cf…) is not the 66304b1 file."
  evidence: "lines 32-33 of shared/ci/retired-tests.sha256"
  status: accepted
  accepted_by: "release owner (this session, 2026-09-22): the file is append-only by design (every version ever synced); the extra hash matches an intermediate commit no repo received"
