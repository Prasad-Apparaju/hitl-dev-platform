checks:
- check: "the plugin builds from 36f85f1 with the guard and reachability clean at 2.16.0"
  command: cp -R hitl-claude-plugin <scratch>; bash scripts/build.sh /Users/Prasad_1/Projects/hitl-dev-platform > build.log
  result: pass
  output: "Build complete; plugin.json 2.16.0"
- check: "linked changes ship where the skills look, and the built skills resolve the checker"
  command: test -e shared/ci/linked/linked.py shared/linked-changes.md; python3 shared/ci/linked/linked.py --help; grep the built skills
  result: fail
  output: "linked.py and linked-changes.md present, --help runs; dev-tdd and ops-deploy never set ROOT so their fallback is /shared/ci/linked/linked.py (F1); dev-apply-change and dev-start-change call $LINKED with it set nowhere (F2)"
- check: "every shared/ reference in built skills, agents and commands resolves"
  command: grep -rhoE 'shared/[A-Za-z0-9_./-]+' skills agents commands | sed | sort -u; test -e each
  result: pass
  output: "0 missing"
- check: "the shipped-validators manifest lists the built linked.py at 2.16.0; --check passes"
  command: shasum -a 256 shared/ci/linked/linked.py; grep; shipped-validators-hashes.py --check
  result: pass
  output: "listed at 2.16.0; manifest current"
- check: "the 2.15.0 upgrade path installs ci/linked and keeps a local edit on rerun"
  command: python3 <built>/shared/ci/first-pass/migrate_project.py --root . --sync-validators <built> --apply, twice
  result: pass
  output: "ci/linked/linked.py installed; 2.15.0 copies identical; the edited linked.py KEPT with the diff and the --overwrite hint"
- check: "stale-test cleanup"
  command: git show 36f85f1:ci/linked/test_linked.py | shasum -a 256; grep retired-tests; grep dev-update
  result: pass
  output: "hash listed by basename; removal list and git add loop name ci/linked"
- check: "claude plugin validate"
  command: claude plugin validate <scratch>
  result: pass
  output: "Validation passed"
- check: "every bold changelog claim has a carrier in the built package or is source-only"
  command: awk the section; grep the built tree
  result: fail
  output: "the traceability-gate claim is shipped as a product-repo gate but check_change.py is not in the package and onboarding does not copy it (F3); the other source-only items are the docs, the design package and the test counts"
- check: "the build commit file list is exactly the release's files"
  command: git -C <scratch> status --short
  result: pass
  output: "24 modified and 2 untracked, all mapping to the v2.15.0..36f85f1 source diff or the build.sh edit"
- check: "fresh onboarding installs ci/linked and ignores .hitl/linked/"
  command: bash tools/scripts/init-project.sh <tmp> --tool claude --name fresh
  result: pass
  output: "ci/linked/linked.py installed; .hitl/linked/ in .gitignore; command count unchanged"
