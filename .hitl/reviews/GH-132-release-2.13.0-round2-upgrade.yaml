findings:
- id: F1
  class: decide
  check: "the script's mirror is the rewrite the build performs"
  claim: "built_form() mirrors one of build.sh's rewrite rules, not the rule set; if a later edit to workflows.yaml adds a path another rule rewrites, --check still passes and the manifest again carries a hash no repo holds, with no signal; the script's comment names a runbook compare step that does not exist."
  evidence: "build.sh lines 474-530 apply six flattenings, a SHARED_PROSE loop and prefix passes to every .yaml under shared/; built_form() has one str.replace; docs/releasing.md has no compare step (grep shasum|compare|built finds prose only)"
  status: fixed
  resolved_by: "plugin repo scripts/release.sh, in the 2.13.0 build commit: after build.sh, every synced non-Python shared file's BUILT hash must be in the built manifest or the release exits 2 with the fix named"
  verified_by: "fresh scratch build from 9998611 with the edited release.sh logic: PASS path, built hash 191d6d02 listed; after removing that manifest line the check returns exit 2; restored, passes again. The source repo's hashes script comment now points at this check only through the runbook's build step, which runs release.sh."
