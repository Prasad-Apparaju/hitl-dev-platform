reviewer:
  model: claude (general-purpose subagent)
  context: clean
  spawned_by: hitl:verification-review brief (run by hand)
  brief: ten-item checklist, evidence rule, one page, <=5 points in three classes, ~15 calls
checks:
- check: Build from source into a scratch clone
  command: bash scripts/build.sh <src>
  result: pass
  output: all shared/ references resolve; Build complete.
- check: New skill exists, old skill is a redirect
  command: ls skills/dev-verification-review/SKILL.md skills/dev-adversarial-review/SKILL.md; grep -c dev-verification-review
    in the redirect
  result: pass
  output: both; 3
- check: New shared files exist; old ones absent from the build
  command: ls shared/verification-review.md shared/templates/verification-review-record.yaml shared/ci/adversarial/check_review.py;
    ls shared/adversarial-review.md shared/templates/adversarial-review-record.yaml
  result: fail
  output: 'new: all present. old: BOTH STILL PRESENT in the build (source has neither)'
- check: Shipped gate identical to source
  command: diff -q shared/ci/adversarial/check_review.py <src>/ci/adversarial/check_review.py
  result: pass
  output: identical
- check: No bare shared/ paths in the built skill
  command: grep -nE '(^|[^}/A-Za-z0-9_])shared/[a-z]' skills/dev-verification-review/SKILL.md
  result: pass
  output: (empty)
- check: Version and changelog
  command: plugin.json version; grep '^## \[2.11.0\]' CHANGELOG.md
  result: pass
  output: 2.11.0; line 7
- check: Old 1.0 records parse under the new gate
  command: check_review.py on .hitl/reviews/GH-92-release-2.8.0-round5-*.yaml --sha 699b87a
  result: pass
  output: no REVIEW_MALFORMED, no WRONG_STANCE; VERDICT_NOT_SHIP is that record's own content
- check: Validator sync keeps a locally differing gate
  command: migrate_project.py --sync-validators <plugin> (dry run) in a repo carrying the published 2.10.1 check_review.py
  result: pass
  output: differs from the shipped version — KEPT yours; not overwritten
- check: Fresh install today is 2.10.1 without the new skill
  command: CLAUDE_CONFIG_DIR=<scratch> claude plugin install hitl@hitl; ls cache
  result: pass
  output: 2.10.1; dev-adversarial-review only
- check: No live references to the old filenames in source
  command: grep -rn 'adversarial-review\.md|adversarial-review-record' ai/ ci/ tools/
  result: pass
  output: 'one hit: the wiring test keeping the .claude/commands redirect for one release'
