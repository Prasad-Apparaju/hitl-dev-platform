# Release waiver store.
#
# A waiver here is a recorded decision to ship past a fail-closed gate: who accepted it, why, what
# was known at the time, and the date it must be looked at again. It mirrors the shape of
# ci/manifest-agentic/manifest-waivers.yaml, including `revisit` — because the failure mode a
# waiver has is not being refused, it is being forgotten.
#
# A skip record in .hitl/current-change.yaml points here by `waiver_ref: <id>`. Skip != waiver:
# the skip says a step did not run, the waiver says who decided that and until when.
schema_version: "1.0"

waivers:
  - id: W-001-release-2.9.0
    code: REVIEW_WAIVED
    locus: adversarial_review
    change_id: GH-103-release-2.9.0
    owner: pappar
    accepted: 2026-09-02
    revisit: 2026-09-16
    covers: ["2.9.0", "2.9.1"]
    reason: >-
      Three adversarial rounds on 2026-08-20/21 (bypass, consequence, upgrade) each returned DO NOT
      SHIP, and the 2026-09-02 release review of 46271e7 found six further items. One of the six was
      fixed before publishing — `retro` shipped as a floor step with no skill behind it, which that
      review called "the smallest thing that stops it". The remaining five were accepted as known
      debt rather than resolved, and 2.9.0 and 2.9.1 were published on that basis.
    findings_of_record:
      - .hitl/reviews/incoming/release-2.9.0.md
      - .hitl/reviews/incoming/bypass-2.9.0-r3.md
      - .hitl/reviews/incoming/consequence-2.9.0-r3.md
      - .hitl/reviews/incoming/upgrade-2.9.0-r3.md
    open_at_publish:
      - "CHANGELOG claims that do not match the shipped catalog (four)"
      - "mid-change upgrade leaves two steps marked `current`"
      - "Step 8 re-enters apply-change and re-asks for plans just declined"
      - "round-3 lens findings never re-checked against HEAD"

  - id: W-002-release-2.10.0
    code: REVIEW_WAIVED
    locus: adversarial_review
    change_id: GH-106-release-2.10.0
    owner: pappar
    accepted: 2026-09-04
    revisit: 2026-09-18
    covers: ["2.10.0"]
    reason: >-
      Adversarial review declined by the owner's decision on 2026-09-04: the open-ended rounds have
      been rabbit holes and token sinks (see #101). In its place a bounded validation of affc690
      (#102) ran in a fresh context: full suite 863, wiring 232, skill lint, catalog verify, four
      live pipeline scenarios (harmless / security-sensitive with pentest hand-marked / question
      never asked / security-sensitive sized fast) each behaving as specified, breadcrumb matrix at
      HEAD and HEAD~1. #103 and #104 shipped with live repros and e2e tests; the step-doc
      renumbering is held by two wiring tests and the matrix (271/271).
    findings_of_record:
      - docs/session-logs/2026-09-04-session-01.md
    open_at_publish:
      - "W-001's five items remain open (changelog claims, mid-change upgrade, Step 8 re-entry, round-3 lenses unchecked)"
      - "sizer `because` for an active cve_audit shows the needed_now sentence over the engages sentence (cosmetic)"
      - "#101 replace adversarial review: not decided"
      - "#96 statusLine repair: open"

  - id: W-003-release-2.10.1
    code: REVIEW_WAIVED
    locus: adversarial_review
    change_id: GH-107-release-2.10.1
    owner: pappar
    accepted: 2026-09-04
    revisit: 2026-09-18
    covers: ["2.10.1"]
    reason: >-
      Documentation-only patch: three rows of the shipped step reference edited after the 2.10.0
      build. Same decision as W-002 (adversarial review declined by the owner on 2026-09-04); the
      change is text, validated by the skill lint and the wiring suite, and the release exercises
      the pin-less release.sh for the first time.
    findings_of_record:
      - docs/session-logs/2026-09-04-session-01.md
    open_at_publish:
      - "everything listed under W-002"
