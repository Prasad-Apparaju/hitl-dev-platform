# Numberless workflow catalog — Phase-1 source of truth.
#
# Stable `key`s, first-class `phases`, no stored `n`/`total`. The generator
# (tools/workflow-catalog/derive.py) derives positional numbers (n, total,
# phase.step) for the runtime view. Numbers live only at the display layer.
#
# Step fields:
#   key     — STABLE identifier. Survives renumbering.
#   name    — readable human name (not reproduction-critical).
#   label   — short breadcrumb label (matches runtime exactly).
#   phase   — workflow phase this step belongs to (matches runtime exactly).
#   substep — true for a sub-step that shares its parent's integer (e.g. 19a).
#   parent  — for a substep, the `key` of the step it hangs off.
#   cond    — conditional spine slot; included only when its activator is active.
#   command — the skill/command that executes the step, or the literal `manual`
#             (human-run, no command) or `guided` (driven by a ref doc, no skill).
#             ADDITIVE: feeds the command-map view; does NOT affect derivation.
#   role    — the owning role: PM / Architect / Dev / QA / Ops / TA.
#             ADDITIVE: feeds the command-map view; does NOT affect derivation.
#
# `verify` proves this numberless catalog reproduces the runtime workflows.yaml
# on n/key/label/phase/total. Do not strip or reorder the spine steps.

schema_version: "3.0-numberless"

spine:
  title: "Development — deliver a change"
  phases: [Requirements, Design, Build, Verify, Assess, Ship, Post-Ship]
  steps:
    # ── Requirements ──────────────────────────────────────────────
    - { key: issue,              name: "GitHub Issue",                 label: "Issue",    phase: "Requirements", command: manual,                       role: PM, crit: standard }
    - { key: figma,              name: "Figma Review",                 label: "Figma",    phase: "Requirements", command: manual,                       role: PM, crit: ceremony }
    # ── Design ────────────────────────────────────────────────────
    - { key: impact,             name: "Impact Analysis",              label: "Impact",   phase: "Design", command: dev-apply-change,             role: Dev, crit: standard, crit_by_tier: { 3: floor } }
    - { key: roi,                name: "ROI Estimate",                 label: "ROI",      phase: "Design", command: guided,                       role: PM, crit: ceremony }
    - { key: docs,               name: "Update Docs",                  label: "Docs",     phase: "Design", command: dev-generate-docs,            role: Architect, crit: standard }
    - { key: iac,                name: "Update IaC",                   label: "IaC",      phase: "Design", command: ops-apply-iac,                role: Ops, crit: standard }
    - { key: test_plan,          name: "Test Case Planning",           label: "Tests",    phase: "Design", command: qa-plan-tests,                role: QA, crit: standard }
    - { key: training,           name: "Training Plan Stub",           label: "Train",    phase: "Design", command: guided,                       role: PM, crit: ceremony }
    - { key: packet,             name: "Package Decision Packet",      label: "Packet",   phase: "Design", command: manual,                       role: Architect, crit: standard, crit_by_tier: { 3: floor } }
    - { key: baseline,           name: "Baseline Measurement",         label: "Basln",    phase: "Design", cond: perf,     command: ops-measure-baseline,         role: Ops, crit: standard }
    - { key: sec_design,         name: "Security Design Review",       label: "SecDsn",   phase: "Design", cond: security, command: dev-review-security,          role: Architect, crit: standard, crit_by_tier: { 3: floor } }
    - { key: cve_audit,          name: "Dependency + CVE Audit",       label: "CVE",      phase: "Design", cond: upgrade,  command: ops-audit-dependencies,       role: Ops, crit: standard, crit_by_tier: { 3: floor } }
    - { key: adv_design,         name: "Adversarial Design Review",    label: "AdvDsgn",  phase: "Design", substep: true, parent: packet, command: dev-adversarial-review, role: Architect, crit: ceremony }
    # ── Build (TDD cycle) ─────────────────────────────────────────
    - { key: red,                name: "AI Generates Tests (RED)",     label: "RED",      phase: "Build", command: dev-tdd,                      role: Dev, crit: standard, no_omit: true }
    - { key: test_review,        name: "Human Reviews Tests",          label: "TstRvw",   phase: "Build", command: qa-review-tests,              role: QA, crit: ceremony }
    - { key: design_plus,        name: "Tests Improve the Design",     label: "Dsn+",     phase: "Build", command: dev-tdd,                      role: Dev, crit: standard }
    - { key: verify_red,         name: "Verify RED",                   label: "VfyRED",   phase: "Build", command: manual,                       role: Dev, crit: standard }
    - { key: green,              name: "Generate Code (GREEN)",        label: "GREEN",    phase: "Build", command: dev-tdd,                      role: Dev, crit: standard, no_omit: true }
    - { key: verify_green,       name: "Verify GREEN",                 label: "VfyGRN",   phase: "Build", command: manual,                       role: Dev, crit: standard }
    - { key: refactor,           name: "Refactor",                     label: "Refact",   phase: "Build", command: manual,                       role: Dev, crit: ceremony }
    - { key: conventions,        name: "Convention Checks",            label: "Conv",     phase: "Build", command: dev-check-conventions,        role: Dev, crit: standard }
    - { key: adv_code,           name: "Adversarial Code Review",      label: "AdvCode",  phase: "Build", substep: true, parent: conventions, command: dev-adversarial-review, role: Architect, crit: ceremony }
    # ── Verify ────────────────────────────────────────────────────
    - { key: review1,            name: "Code Review Round 1",          label: "Rvw1",     phase: "Verify", command: dev-review-lld-adherence,     role: Dev, crit: standard }
    - { key: review2,            name: "Code Review Round 2",          label: "Rvw2",     phase: "Verify", command: dev-review-security,          role: Dev, crit: standard }
    - { key: arch_review,        name: "Architect Code Review",        label: "ArchRvw",  phase: "Verify", substep: true, parent: review2, command: architect-review-code, role: Architect, crit: standard, crit_by_tier: { 3: floor } }
    - { key: rerun,              name: "Rerun Tests",                  label: "Rerun",    phase: "Verify", command: manual,                       role: Dev, crit: standard }
    - { key: reconcile,          name: "Reconcile Docs",               label: "Recncl",   phase: "Verify", command: dev-generate-docs,            role: Dev, crit: standard }
    - { key: qa_verify,          name: "QA Post-Handoff Verification", label: "QAVfy",    phase: "Verify", command: qa-verify-quality,            role: QA, crit: standard, crit_by_tier: { 3: floor } }
    # ── Assess ────────────────────────────────────────────────────
    - { key: impact_brief,       name: "Downstream Impact Brief",      label: "ImpBrf",   phase: "Assess", command: dev-impact-brief,             role: Dev, crit: ceremony }
    - { key: rollout,            name: "Risk-Rated Rollout Plan",      label: "Rollout",  phase: "Assess", command: ops-review-release,           role: Ops, crit: standard, crit_by_tier: { 3: floor } }
    # ── Ship ──────────────────────────────────────────────────────
    - { key: verify_pr,          name: "Verify PR Completeness",       label: "VfyPR",    phase: "Ship", command: manual,                       role: Dev, crit: standard }
    - { key: integration_verify, name: "Integration Verification",     label: "IntVfy",   phase: "Ship", command: architect-verify-traceability, role: Architect, crit: standard, crit_by_tier: { 2: floor } }
    - { key: figma_compare,      name: "Figma Comparison",             label: "Figma2",   phase: "Ship", command: manual,                       role: QA, crit: ceremony }
    - { key: deploy,             name: "Build, Migrate, Apply, Deploy",label: "Deploy",   phase: "Ship", command: ops-deploy,                   role: Ops, crit: floor }
    - { key: pentest,            name: "Penetration Test",             label: "Pentest",  phase: "Ship",   cond: security, command: ops-pentest,                 role: Ops, crit: floor }
    - { key: promote,            name: "Promote or Rollback",          label: "Promote",  phase: "Ship", command: ops-post-deploy-monitor,      role: Ops, crit: floor }
    # ── Post-Ship ─────────────────────────────────────────────────
    - { key: roi_30,             name: "30-Day ROI Check",             label: "30dROI",   phase: "Post-Ship", command: guided,                       role: PM, crit: ceremony }
    - { key: roi_90,             name: "90-Day ROI Check",             label: "90dROI",   phase: "Post-Ship", command: guided,                       role: PM, crit: ceremony }

workflows:

  # ── Brownfield setup: onboard an existing codebase ──────────────
  brownfield:
    title: "Brownfield — onboard an existing codebase"
    phases: [Brownfield Setup]
    steps:
      - { key: map_code,         name: "Map Codebase",                 label: "MapCode",    phase: "Brownfield Setup" }
      - { key: claude_md,        name: "Generate CLAUDE.md",           label: "CLAUDE.md",  phase: "Brownfield Setup" }
      - { key: manifest,         name: "Generate Manifest",            label: "Manifest",   phase: "Brownfield Setup" }
      - { key: arch_review,      name: "Architect Review",             label: "ArchRvw",    phase: "Brownfield Setup" }
      - { key: verify_pipeline,  name: "Verify Pipeline",              label: "Pipeline",   phase: "Brownfield Setup" }
      - { key: observability,    name: "Observability Setup",          label: "Observ",     phase: "Brownfield Setup" }
      - { key: priority_docs,    name: "Priority Docs",                label: "Docs",       phase: "Brownfield Setup" }
      - { key: seed_registries,  name: "Seed Registries",              label: "Registries", phase: "Brownfield Setup" }
      - { key: graphify,         name: "Graphify",                     label: "Graphify",   phase: "Brownfield Setup" }
      - { key: create_issue,     name: "Create Issue",                 label: "Issue",      phase: "Brownfield Setup" }
      - { key: confirm_ready,    name: "Confirm Ready",                label: "Ready",      phase: "Brownfield Setup" }

  # ── Migration setup: stand up a target for a system migration ────
  migration:
    title: "Migration — set up a target for a system migration"
    phases: [Migration Setup]
    steps:
      - { key: collect_context,  name: "Collect Context",              label: "Context",    phase: "Migration Setup" }
      - { key: claude_md,        name: "Generate CLAUDE.md",           label: "CLAUDE.md",  phase: "Migration Setup" }
      - { key: manifest,         name: "Generate Manifest",            label: "Manifest",   phase: "Migration Setup" }
      - { key: dir_setup,        name: "Directory Setup",              label: "DirSetup",   phase: "Migration Setup" }
      - { key: source_analysis,  name: "Source Analysis",              label: "SrcAnal",    phase: "Migration Setup" }
      - { key: ext_docs,         name: "External Docs",                label: "ExtDocs",    phase: "Migration Setup" }
      - { key: seed_registries,  name: "Seed Registries",              label: "Registries", phase: "Migration Setup" }
      - { key: create_issue,     name: "Create Issue",                 label: "Issue",      phase: "Migration Setup" }
      - { key: confirm_ready,    name: "Confirm Ready",                label: "Ready",      phase: "Migration Setup" }

  # ── Migration review: critically evaluate external migration docs ─
  migration_review:
    title: "Migration Review — evaluate external migration docs"
    phases: [Migration Review]
    steps:
      - { key: read_context,     name: "Read Context",                 label: "Context",  phase: "Migration Review" }
      - { key: evaluate,         name: "Evaluate Docs",                label: "Evaluate", phase: "Migration Review" }
      - { key: write_review,     name: "Write Migration Review",       label: "MigRvw",   phase: "Migration Review" }
      - { key: write_brief,      name: "Write Brief",                  label: "Brief",    phase: "Migration Review" }
      - { key: handoff,          name: "Handoff",                      label: "Handoff",  phase: "Migration Review" }

  # ── Greenfield setup: stand up a greenfield project from a PRD ───
  # Runtime id: prd
  greenfield:
    title: "PRD — stand up a greenfield project from a PRD"
    phases: [PRD Setup]
    steps:
      - { key: claude_md,        name: "Generate CLAUDE.md",           label: "CLAUDE.md", phase: "PRD Setup" }
      - { key: manifest,         name: "Generate Manifest",            label: "Manifest",  phase: "PRD Setup" }
      - { key: create_issue,     name: "Create Issue",                 label: "Issue",     phase: "PRD Setup" }
      - { key: confirm_ready,    name: "Confirm Ready",                label: "Ready",     phase: "PRD Setup" }
      - { key: platform_roadmap, name: "Generate Platform Roadmap",    label: "Platform",  phase: "PRD Setup" }

  # ── Platform bootstrap: onboarded → delivery-ready (design: docs/design/platform-bootstrap/) ──
  # Long-lived, per-project. Progress lives in docs/04-operations/platform-readiness.yaml, NOT in
  # .hitl/current-change.yaml (roadmap items are ordinary changes and need the change file).
  # `cond: migration` steps are included only when the readiness register says
  # project_kind: migration (resolved by ops-plan-platform at generation time).
  platform:
    title: "Platform Bootstrap — onboarded to delivery-ready"
    phases: [Survey, Verify, Deliver, Operate, Parity, Cutover, Ready]
    steps:
      # ── Survey ────────────────────────────────────────────────────
      - { key: derive_register,  name: "Derive Readiness Register",     label: "Register", phase: "Survey",  command: ops-plan-platform,          role: TA }
      - { key: roadmap,          name: "Generate Roadmap",              label: "Roadmap",  phase: "Survey",  command: ops-plan-platform,          role: TA }
      # ── Verify (layer D) ──────────────────────────────────────────
      - { key: test_suites,      name: "Tier Test Suites Stand",        label: "Suites",   phase: "Verify",  command: manual,                     role: QA }
      - { key: e2e_env,          name: "E2E Against Real Environment",  label: "E2E",      phase: "Verify",  command: manual,                     role: QA }
      - { key: traceability,     name: "Test-to-Requirement Matrix",    label: "Trace",    phase: "Verify",  command: guided,                     role: QA }
      # ── Deliver (layer E) ─────────────────────────────────────────
      - { key: build_repro,      name: "Reproducible Build",            label: "Build",    phase: "Deliver", command: ops-build,                  role: Ops }
      - { key: deploy_playbook,  name: "Full-System Deploy Playbook",   label: "Playbook", phase: "Deliver", command: guided,                     role: Ops }
      - { key: cd_from_ci,       name: "Deploy Executed From CI",       label: "CD",       phase: "Deliver", command: manual,                     role: Ops }
      # ── Operate (layer F) ─────────────────────────────────────────
      - { key: obs_established,  name: "Observability Established",     label: "Observ",   phase: "Operate", command: ops-setup-observability,    role: Ops }
      - { key: canary_exercised, name: "Progressive Release Exercised", label: "Canary",   phase: "Operate", command: ops-deploy,                 role: Ops }
      - { key: sec_posture,      name: "Security Posture Settled",      label: "SecPos",   phase: "Operate", command: ops-pentest,                role: Ops }
      # ── Parity (migration only) ───────────────────────────────────
      - { key: golden_dataset,   name: "Golden Dataset Harness",        label: "Golden",   phase: "Parity",  cond: migration, command: guided,    role: QA }
      - { key: shadow_run,       name: "Shadow/Dual-Run Comparison",    label: "Shadow",   phase: "Parity",  cond: migration, command: guided,    role: Ops }
      # ── Cutover (migration only) ──────────────────────────────────
      - { key: cutover_plan,     name: "Cutover + Rollback-to-Legacy Plan", label: "CutPlan", phase: "Cutover", cond: migration, command: guided, role: Ops }
      - { key: dual_run,         name: "Dual-Run Window",               label: "DualRun",  phase: "Cutover", cond: migration, command: manual,    role: Ops }
      - { key: decommission,     name: "Legacy Sunset + Archival",      label: "Sunset",   phase: "Cutover", cond: migration, command: manual,    role: Ops }
      # ── Ready ─────────────────────────────────────────────────────
      - { key: delivery_ready,   name: "Definition of Ready Verified",  label: "Ready",    phase: "Ready",   command: ops-plan-platform,          role: TA }

  # ── Docs change: a documentation-only change ────────────────────
  # Its own short spine (no code, no TDD) with a domain-routed reviewer gate.
  # Chosen only when a change touches nothing but docs; mixed changes use the
  # delivery spine. See docs/design/workflow-model/01-design.md §4.
  release:
    title: "Release — publish a version to users"
    phases:
    - Prepare
    - Verify
    - Gate
    - Publish
    - Confirm
    steps:
    - key: rc_scope
      name: Determine Release Scope
      label: Scope
      phase: Prepare
      command: manual
      role: Dev
      crit: standard
    - key: changelog
      name: Write Release Notes
      label: Notes
      phase: Prepare
      command: manual
      role: Dev
      crit: standard
    - key: version_bump
      name: Bump Version
      label: Bump
      phase: Prepare
      command: manual
      role: Dev
      crit: standard
    - key: gates
      name: Run Test and Lint Gates
      label: Gates
      phase: Verify
      command: dev-validate
      role: Dev
      crit: floor
      no_omit: true
    - key: adversarial_review
      name: Independent Adversarial Review
      label: Adversarial
      phase: Gate
      command: manual
      role: Architect
      crit: floor
    - key: resolve_findings
      name: Resolve or Accept Findings
      label: Resolve
      phase: Gate
      command: manual
      role: Dev
      crit: floor
    - key: build
      name: Build the Package
      label: Build
      phase: Publish
      command: manual
      role: Ops
      crit: standard
    - key: publish
      name: Publish to Users
      label: Publish
      phase: Publish
      command: manual
      role: Ops
      crit: floor
      no_omit: true
    - key: tag
      name: Tag the Source
      label: Tag
      phase: Publish
      command: manual
      role: Ops
      crit: standard
    - key: install_verify
      name: Verify the Published Artifact
      label: Verify
      phase: Confirm
      command: manual
      role: Ops
      crit: floor
      no_omit: true
    - key: announce
      name: Announce
      label: Announce
      phase: Confirm
      command: manual
      role: PM
      crit: ceremony
    - key: retire
      name: Retire Change Artifacts
      label: Retire
      phase: Confirm
      command: manual
      role: Dev
      crit: standard

  docs:
    title: "Docs — a documentation-only change"
    phases: [Docs Change]
    steps:
      - { key: issue,            name: "GitHub Issue",                 label: "Issue",     phase: "Docs Change" }
      - { key: scope,            name: "Scope Docs Impact",            label: "Scope",     phase: "Docs Change" }
      - { key: draft,            name: "Write / Update Docs",          label: "Draft",     phase: "Docs Change" }
      - { key: doc_review,       name: "Docs Review",                  label: "Review",    phase: "Docs Change" }
      - { key: reconcile,        name: "Reconcile Cross-Refs",         label: "Reconcile", phase: "Docs Change" }
      - { key: merge,            name: "Merge",                        label: "Merge",     phase: "Docs Change" }

# ── Delivery profiles: ADVISORY presets over the shared spine ───────────────────────────────
#
# READ THIS BEFORE TRUSTING A FIELD HERE. Profiles and tags are **advice to intake**, not a filter
# on the plan. They describe what a change of this kind usually needs, and they are meant to inform
# what intake pre-selects. Nothing at runtime applies them.
#
# Concretely: `ai/shared/workflows.yaml` — the file a change file is actually seeded from — carries
# only `workflows`. It has no `profiles` and no `tags`, and the change-file generator takes the
# whole `development` block verbatim. `derive.py` implements `excludes`/`activates` correctly and
# is a source-tree tool that the plugin does not ship. So:
#
#   `fix` excluding roi+training      has never removed a step from a real plan
#   `chore` carrying tier: 0          has never set a tier
#   `perf` activating baseline        has never turned that step on
#
# Every change gets the same 31 numbered steps regardless of profile or tag. That is deliberate as
# of now: right-sizing happens where a human can see it — the intake selection — rather than by a
# taxonomy silently filtering the plan before anyone reads it. These fields feed that selection's
# defaults and the generated docs.
#
# A profile selects which conditional spine slots it suggests (`activates`), which steps it suggests
# dropping (`excludes`), and the `required_evidence` a change of this kind owes
# (see docs/design/workflow-model/03-execution-model.md).
# `feature` is the base: no conditionals, nothing excluded == the runtime `development` workflow.
profiles:
  feature:
    class: functional
    initiator: PM
    activates: []
    excludes: []
    required_evidence: [tests_red, tests_green, spec_conformance_review, qa_review, downstream_impact_brief]
  enhancement:
    class: functional
    initiator: PM
    activates: []
    excludes: []
    required_evidence: [tests_red, tests_green, spec_conformance_review, qa_review, downstream_impact_brief, back_compat]
  fix:
    class: functional
    initiator: PM/QA
    activates: []
    excludes: [roi, training]
    required_evidence: [tests_red, tests_green, qa_review, regression_test]
  tech_change:
    class: technical
    initiator: Dev/Arch
    activates: []
    excludes: [figma, roi, training, figma_compare]
    required_evidence: [tests_red, tests_green, spec_conformance_review]
  upgrade:
    class: technical
    initiator: Dev/Ops
    activates: [upgrade]
    excludes: [figma, training, figma_compare]
    required_evidence: [cve_audit, full_regression, spec_conformance_review]
  security:
    class: technical
    initiator: Sec/Arch/Ops
    activates: [security]
    excludes: [figma, training, figma_compare]
    required_evidence: [security_review, pentest, tests_green]
    skip_authority: { security_review: never, pentest: never }

# ── Change-kind tags: stack on a profile, tune required-evidence ─────────────────────────────
# A tag may activate a conditional spine slot (e.g. perf -> baseline) and adds evidence. Tags
# compose: {Fix, perf, upgrade} unions all three evidence sets. `chore` is Tier-0 (floor only).
tags:
  refactor: { activates: [],     required_evidence: [characterization_tests, behavior_unchanged] }
  perf:     { activates: [perf], required_evidence: [perf_budget_met] }
  chore:    { tier: 0, activates: [], required_evidence: [] }
  tooling:  { activates: [],     required_evidence: [] }
  infra:    { activates: [],     required_evidence: [] }

# ── What each step protects, and what skipping it costs ─────────────────────────────────────
#
# Read by the intake selection: `protects` is the sentence shown beside an unticked box, and
# `forgo_cost` ranks the list so the consequential choices sit at the top.
#
# `forgo_cost` is the cost of skipping the step ON A CHANGE THAT ENGAGES IT — not an average.
# The rank shown to a person is modulated in both directions:
#   • down one   when `engages` does not match the change (paths from the diff, profile/tags from
#                the change file, multi_domain from the manifest)
#   • up one     when the change touches a manifest domain with entries in the incident registry —
#                "this area has burned us before" is the one signal worth raising on. A project with
#                no registry, or a registry with no matching entry, is treated the same: no raise.
#   • never past the floor. Modulation reorders the list. It does not unlock a floor step or soften
#     `no_omit`; those are decided by tier and by signature, not by rank.
#
# Every spine step has an entry and there are no orphans — ci/wiring asserts both.
step_costs:
  issue:
    protects: "There is a written record of what was asked for and why, outliving the conversation that produced it."
    forgo_cost: high
    engages: always
  figma:
    protects: "What gets built matches what design actually drew, rather than a developer's reading of it."
    forgo_cost: low
    engages: { paths: ["**/*.tsx", "**/*.jsx", "**/*.vue", "**/components/**", "**/ui/**"] }
  impact:
    protects: "You find the callers, data and scheduled jobs this touches before you touch them."
    forgo_cost: high
    engages: always
  roi:
    protects: "There is a stated reason this is worth building, recorded before the effort is spent."
    forgo_cost: low
    engages: { profiles: ["feature"] }
  docs:
    protects: "The runbook and reference stop describing a system that no longer exists."
    forgo_cost: medium
    engages: { paths: ["docs/**", "**/*.md", "**/README*"] }
  iac:
    protects: "Infrastructure changes are written down and reviewable, not applied by hand and forgotten."
    forgo_cost: medium
    engages: { paths: ["infra/**", "**/*.tf", "**/Dockerfile", "k8s/**", "**/*.yaml"] }
  test_plan:
    protects: "QA knows what \"working\" means for this change before anyone builds it."
    forgo_cost: medium
    engages: { profiles: ["feature", "enhancement", "fix"] }
  training:
    protects: "The people who operate this are told it changed."
    forgo_cost: low
    engages: { profiles: ["feature"] }
  packet:
    protects: "The decision and the alternatives are recorded where the next person will look for them."
    forgo_cost: medium
    engages: always
  baseline:
    protects: "There is a before-measurement, so \"faster\" is a number instead of a feeling."
    forgo_cost: medium
    engages: { tags: ["perf"] }
  sec_design:
    protects: "The threat model is considered while the design can still change cheaply."
    forgo_cost: high
    engages: { profiles: ["security"] }
  cve_audit:
    protects: "You know which published vulnerabilities the version you are moving to carries."
    forgo_cost: high
    engages: { profiles: ["upgrade"] }
  adv_design:
    protects: "Someone with no stake in the design tries to break it while it is still cheap to change."
    forgo_cost: medium
    engages: always
  red:
