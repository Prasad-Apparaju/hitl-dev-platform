rules:
  - id: external-calls-must-use-retry-wrapper
    message: >
      External API calls should be wrapped in retry_external_call()
      for transient failure handling with exponential backoff.
      See the transient failure retry policy convention.
    severity: WARNING
    languages: [python]
    patterns:
      - pattern: await $CLIENT.$METHOD(...)
      - pattern-not-inside: retry_external_call(...)
      - metavariable-regex:
          metavariable: $CLIENT
          regex: "(httpx_client|http_client|external_client)"
    # The `metavariable-regex` above already limits this to the project's HTTP client objects,
    # so no directory scope is needed (issue #46). Only the resilience wrapper itself is exempt,
    # matched unanchored so it is found wherever the project keeps it.
    paths:
      exclude:
        - "**/resilience.py"
    metadata:
      category: best-practice
      confidence: MEDIUM
