rules:
  - id: no-fstring-in-sql-execute
    message: >
      Do not use f-strings or .format() in SQL execute() calls.
      Use parameterized queries: cursor.execute("SELECT ... WHERE id = %s", (id,))
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: $CURSOR.execute(f"...", ...)
      - pattern: $CURSOR.execute("...".format(...), ...)
      - pattern: $CURSOR.execute("..." + $X, ...)
      - pattern: $SESSION.execute(f"...", ...)
      - pattern: $SESSION.execute(text(f"..."), ...)
      # Implicit concatenation involving an f-string, both orders (issue #45). This is how long
      # SQL gets written across lines without trailing-space bugs, and formatters produce it, so
      # it is the shape most likely to appear in real code — and the one that used to slip past.
      # Missing it is worse than a missed finding: a team fixes every flagged site, sees the scan
      # return 0, and concludes the file is clean while the pattern is still there.
      - pattern: $CURSOR.execute(f"..." "...", ...)
      - pattern: $CURSOR.execute("..." f"...", ...)
    metadata:
      category: security
      confidence: HIGH

  - id: no-fstring-in-sqlalchemy-text
    message: >
      Never pass raw f-strings to SQLAlchemy text().
      Use bound parameters: text("SELECT * WHERE id = :id").bindparams(id=val)
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: text(f"...")
      - pattern: text("...".format(...))
      - pattern: text("..." + ...)
      # Same implicit-concatenation gap as the rule above (issue #45).
      - pattern: text(f"..." "...")
      - pattern: text("..." f"...")
    metadata:
      category: security
      confidence: HIGH
