rules:
  - id: mutating-tool-must-implement-describe-plan
    message: >
      All MutatingTool subclasses must implement _describe_plan().
      This method returns a dry-run preview for PLAN mode.
      See docs/patterns/idempotency-keys.md.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: |
          class $CLASS(MutatingTool):
              ...
      - pattern-not: |
          class $CLASS(MutatingTool):
              ...
              def _describe_plan(self, ...):
                  ...
    # No `paths:` scope (issue #46). The pattern keys off `class X(MutatingTool)`, which is
    # already self-limiting — it cannot match anything that is not a MutatingTool subclass.
    # A path scope here would only make the rule silently inert in projects that lay their
    # code out differently, which is exactly how it shipped hardcoded to one repo's layout.
    metadata:
      category: correctness
      confidence: HIGH

  - id: mutating-tool-must-have-idempotency-key
    message: >
      MutatingTool.execute() must accept an idempotency_key parameter
      derived from business state, not runtime state.
      See docs/patterns/idempotency-keys.md.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: |
          class $CLASS(MutatingTool):
              ...
              def execute(self, ...):
                  ...
      - pattern-not: |
          class $CLASS(MutatingTool):
              ...
              def execute(self, ..., idempotency_key=..., ...):
                  ...
    # No `paths:` scope — see the note on the rule above (issue #46).
    metadata:
      category: correctness
      confidence: HIGH
