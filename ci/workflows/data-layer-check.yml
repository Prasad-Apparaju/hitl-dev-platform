name: Data layer

# Checks the data layer (FR-31) on every PR: the validator over docs/02-design/data/ and the scorecard
# against the committed baseline. Advisory by default: findings are printed and the job passes. With
# `data_layer: { blocking: true }` in .hitl/config.yaml the validator's blocking findings and a
# scorecard regression fail the build. A repo without docs/02-design/data/ passes with one line.
#
# Copy to .github/workflows/ in your product repo (onboarding does this). Requires ci/data-layer/
# (copied by onboarding and kept current by /hitl:dev-update).

on:
  pull_request:

jobs:
  data-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Validate the data layer
        run: |
          if [ ! -d docs/02-design/data ]; then
            echo "data layer: absent, nothing to check."
            exit 0
          fi
          blocking=$(python3 -c "import yaml,os;d=yaml.safe_load(open('.hitl/config.yaml')) if os.path.exists('.hitl/config.yaml') else {};print(str((d or {}).get('data_layer',{}).get('blocking',False)).lower())")
          set +e
          python3 ci/data-layer/check_data_layer.py --data-dir docs/02-design/data --manifest docs/system-manifest.yaml --waivers ci/data-layer/data-layer-waivers.yaml
          v=$?
          base=""; [ -f docs/02-design/data/scorecard.yaml ] && base="--baseline docs/02-design/data/scorecard.yaml"
          python3 ci/data-layer/scorecard.py --data-dir docs/02-design/data $base --no-write --strict
          s=$?
          set -e
          if [ "$blocking" = "true" ]; then
            [ $v -eq 0 ] || { echo "data layer: blocking mode, validator failed"; exit 1; }
            [ $s -eq 0 ] || { echo "data layer: blocking mode, scorecard regressed"; exit 1; }
          else
            [ $v -eq 0 ] && [ $s -eq 0 ] || echo "data layer: advisory mode, see the findings above (set data_layer.blocking: true in .hitl/config.yaml to fail the build)"
          fi
