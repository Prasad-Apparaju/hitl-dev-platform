name: Test scenarios

# Readable test scenarios (FR-36): on any PR that carries a change record, run the two-way scenario
# check at stage review. It exits 0 when clean, 2 on a blocker (a scenario with no test and no
# recorded reason, an acceptance or integration test with no scenario, a malformed or missing file),
# failing the build. A repo with no change record passes unchanged.
#
# Copy to .github/workflows/ in your product repo (init-project.sh does this). Requires
# ci/test-scenarios/check_scenarios.py (copied by onboarding, like ci/first-pass).

on:
  pull_request:

jobs:
  test-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Check the scenarios file against the tests (fail-closed)
        run: |
          if [ -f .hitl/current-change.yaml ]; then
            # A change record written before 2.17.0 predates scenarios files. Report only (draft
            # stage) until test review or QA verify writes the file; then the review stage applies.
            stage=$(python3 -c "import yaml,sys;r=yaml.safe_load(open('.hitl/current-change.yaml')) or {};v=str(r.get('hitl_version','0')).split('.');v=[int(x) if x.isdigit() else 0 for x in v]+[0,0];print('draft' if 'scenarios_file' not in (r.get('tests') or {}) and v[:2]<[2,17] else 'review')")
            [ "$stage" = draft ] && echo "Change record predates 2.17.0 and names no scenarios file: reporting only (draft stage) until test review writes it."
            python3 ci/test-scenarios/check_scenarios.py --change .hitl/current-change.yaml --stage "$stage"
          else
            echo "No .hitl/current-change.yaml: nothing to check."
          fi
