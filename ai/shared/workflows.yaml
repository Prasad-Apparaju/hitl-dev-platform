      - { n: 13, key: shadow_run,       label: "Shadow",   phase: "Parity",  cond: migration, command: guided }
      - { n: 14, key: cutover_plan,     label: "CutPlan",  phase: "Cutover", cond: migration, command: guided }
      - { n: 15, key: dual_run,         label: "DualRun",  phase: "Cutover", cond: migration, command: manual }
      - { n: 16, key: decommission,     label: "Sunset",   phase: "Cutover", cond: migration, command: manual }
