      - { n: 4,  key: e2e_env,          label: "E2E",      phase: "Verify", command: manual }
      - { n: 5,  key: traceability,     label: "Trace",    phase: "Verify", command: guided }
      - { n: 6,  key: build_repro,      label: "Build",    phase: "Deliver", command: ops-build }
      - { n: 7,  key: deploy_playbook,  label: "Playbook", phase: "Deliver", command: guided }
      - { n: 8,  key: cd_from_ci,       label: "CD",       phase: "Deliver", command: manual }
