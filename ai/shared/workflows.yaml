  # ── Platform bootstrap: onboarded → delivery-ready (17 steps; 12 without migration) ──────────
  # Canonical source: ai/claude/ops/plan-platform/SKILL.md + docs/design/platform-bootstrap/.
  # Long-lived and per-project: progress lives in docs/04-operations/platform-readiness.yaml,
  # NOT in .hitl/current-change.yaml — roadmap items are ordinary changes and need the change
  # file. `cond: migration` steps apply only when the register says project_kind: migration
  # (ops-plan-platform resolves this at roadmap generation; renderers never read this entry).
  platform:
